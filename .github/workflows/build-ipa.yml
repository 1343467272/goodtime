name: Build IPA

# 手动触发：在 GitHub Actions 页面点击 Run workflow 即可编译并导出 IPA 产物。
# ⚠️  此 workflow 使用 Debug 构建。原因：
#   macos-26 runner 只有 7GB 内存、无 swap。Release 的 Kotlin/Native LTO 优化
#   （DevirtualizationAnalysis）需要 >8GB 堆内存，在此 runner 上必定 OOM。
#   Debug 构建跳过 LTO，内存占用小，IPA 可正常安装使用。
#   如需 Release IPA，请使用内存 ≥16GB 的 runner（如 macos-14-large / 自建 runner）。
on:
  workflow_dispatch:
    inputs:
      method:
        description: 'Export method (ignored for unsigned Debug builds)'
        required: true
        default: 'development'
        type: choice
        options:
          - development
          - ad-hoc
          - app-store

concurrency:
  group: build-ipa
  cancel-in-progress: true

jobs:
  build-ipa:
    # macOS 26 / Xcode 26：
    #   - extension deployment target 26.0
    #   - Compose Multiplatform 1.11 的 K/N 产物引用了只在 iOS 26 SDK 存在的符号，
    #     旧 SDK 上 link 会报 "Undefined symbols"。
    runs-on: macos-26
    permissions:
      contents: write
    timeout-minutes: 120
    env:
      METHOD: ${{ inputs.method || 'development' }}
      TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
      CERT_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
      CERT_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}

    steps:
      - name: Check runner memory
        run: |
          echo "=== Physical memory ==="
          sysctl hw.memsize | awk '{printf "%.1f GB\n", $2/1073741824}'
          echo "=== Swap ==="
          sysctl vm.swapusage

      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Check Xcode version
        run: xcodebuild -version

      - name: Import signing certificate
        if: env.CERT_BASE64 != '' && env.CERT_PASSWORD != ''
        env:
          KEYCHAIN_PASSWORD: ${{ runner.temp }}/keychain-password
        run: |
          set -euo pipefail
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          echo "$CERT_BASE64" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" \
            -k build.keychain -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$KEYCHAIN_PASSWORD" build.keychain

      # 预编译 Debug Kotlin 框架：提前暴露报错；Debug 无 LTO，不会 OOM。
      - name: Pre-link Kotlin framework (iosArm64 Debug)
        run: ./gradlew :shared:linkDebugFrameworkIosArm64 --stacktrace

      # Archive（Debug 配置）
      - name: Archive
        run: |
          set -euo pipefail
          if [ -n "$CERT_BASE64" ] && [ -n "$CERT_PASSWORD" ] && [ -n "$TEAM_ID" ]; then
            xcodebuild archive \
              -project iosApp/iosApp.xcodeproj \
              -scheme iosApp \
              -configuration Debug \
              -destination 'generic/platform=iOS' \
              -archivePath "$RUNNER_TEMP/iosApp.xcarchive" \
              -allowProvisioningUpdates \
              DEVELOPMENT_TEAM="$TEAM_ID"
          else
            xcodebuild archive \
              -project iosApp/iosApp.xcodeproj \
              -scheme iosApp \
              -configuration Debug \
              -destination 'generic/platform=iOS' \
              -archivePath "$RUNNER_TEMP/iosApp.xcarchive" \
              CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
          fi

      - name: Export IPA
        run: |
          set -euo pipefail
          APP_NAME="Goodtime: Pomodoro Timer.app"
          if [ -n "$CERT_BASE64" ] && [ -n "$CERT_PASSWORD" ] && [ -n "$TEAM_ID" ]; then
            cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>$METHOD</string>
              <key>teamID</key>
              <string>$TEAM_ID</string>
              <key>signingStyle</key>
              <string>automatic</string>
          </dict>
          </plist>
          EOF
            xcodebuild -exportArchive \
              -archivePath "$RUNNER_TEMP/iosApp.xcarchive" \
              -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
              -exportPath "$RUNNER_TEMP/ipa"
            mv "$RUNNER_TEMP/ipa/$APP_NAME.ipa" "$RUNNER_TEMP/Goodtime-Debug.ipa"
          else
            mkdir -p "$RUNNER_TEMP/ipa/Payload"
            cp -R "$RUNNER_TEMP/iosApp.xcarchive/Products/Applications/$APP_NAME" "$RUNNER_TEMP/ipa/Payload/"
            (cd "$RUNNER_TEMP/ipa" && zip -qry "$RUNNER_TEMP/Goodtime-Debug-unsigned.ipa" Payload)
          fi

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Goodtime-ipa
          path: ${{ runner.temp }}/*.ipa
          if-no-files-found: error

      - name: Create GitHub Release with IPA
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ipa-${{ github.run_id }}
          name: IPA Debug build #${{ github.run_id }}
          body: |
            iOS IPA build artifact (Debug configuration).

            > **Note:** Debug build because the macos-26 runner has only 7 GB RAM.
            > Release Kotlin/Native LTO needs >8 GB heap and OOMs here.
            > Use a runner with >= 16 GB RAM for Release builds.
          files: ${{ runner.temp }}/*.ipa
          draft: false
          prerelease: true
